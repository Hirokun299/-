<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>俺のトイレットペーパー！</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#efe7da}
body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:#2b2b33;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#timer{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-family:"SF Mono","Menlo","Consolas",monospace;font-size:44px;font-weight:900;color:#2b2b33;background:rgba(255,255,255,.85);border-radius:16px;padding:2px 18px;box-shadow:0 3px 0 rgba(0,0,0,.12);display:none;font-variant-numeric:tabular-nums;letter-spacing:1px}
#timer small{font-size:20px;margin-left:2px}
#remain{position:fixed;top:78px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:bold;color:#6b6460;display:none;white-space:nowrap}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:10}
.screen.on{display:flex}
#title{background:linear-gradient(rgba(239,231,218,.1),rgba(239,231,218,.35) 55%,rgba(239,231,218,.95));justify-content:space-between;padding:9vh 20px 8vh;cursor:pointer}
.logo{display:inline-block;background:rgba(255,255,255,.9);border-radius:24px;padding:14px 22px 12px;box-shadow:0 8px 24px rgba(90,70,50,.18);font-size:46px;font-weight:900;line-height:1.1;color:#3a5a8c;text-shadow:0 4px 0 #fff,0 7px 0 rgba(0,0,0,.12);letter-spacing:2px}
.logo span{display:block;font-size:22px;color:#c0563c;letter-spacing:6px;margin-bottom:6px}
.catch{margin-top:10px;font-size:14px;font-weight:bold;color:#6b6460}
.tap{font-size:24px;font-weight:900;color:#3a5a8c;text-shadow:0 2px 0 #fff;animation:blink 1.1s ease-in-out infinite;letter-spacing:3px}
@keyframes blink{50%{opacity:.25}}
.best{margin-top:8px;font-size:14px;color:#6b6460;font-weight:bold}
.help{margin-top:8px;font-size:12px;color:#8a837e;line-height:1.6}
#call{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:58px;font-weight:900;color:#c0563c;text-shadow:0 5px 0 #fff,0 8px 10px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap;z-index:6;display:none}
#call.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.2)}to{transform:translate(-50%,-50%) scale(1)}}
#call.gold{color:#d49b00;font-size:30px}
#result{background:rgba(40,36,34,.55)}
.card{background:#fff;border-radius:24px;padding:22px 18px 18px;width:100%;max-width:340px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.card.goldc{background:linear-gradient(#fffbe6,#fff1b8);box-shadow:0 0 0 4px #f5c518,0 12px 30px rgba(0,0,0,.25)}
.done{font-size:16px;font-weight:900;color:#c0563c;letter-spacing:4px}
.rtime{font-family:"SF Mono","Menlo","Consolas",monospace;font-size:60px;font-weight:900;color:#2b2b33;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
.rtime small{font-size:24px}
.new{display:inline-block;background:#c0563c;color:#fff;font-size:13px;font-weight:900;border-radius:999px;padding:3px 12px;transform:rotate(-3deg);margin-bottom:6px}
.rank{font-size:24px;font-weight:900;color:#3a5a8c;margin:6px 0 2px}
.rsub{font-size:13px;color:#8a837e;margin-bottom:12px;line-height:1.6}
.btn{display:block;width:100%;border:none;border-radius:999px;padding:15px;font:inherit;font-size:18px;font-weight:900;cursor:pointer;margin-top:9px}
.b1{background:linear-gradient(#5b86c8,#3a5a8c);color:#fff;box-shadow:0 5px 0 #24395c}
.b2{background:#111;color:#fff;box-shadow:0 5px 0 #000}
.b3{background:#efe7da;color:#5a534e;box-shadow:0 4px 0 #cfc4b3;font-size:15px;padding:11px}
.btn:active{transform:translateY(3px);box-shadow:none}
</style>

<canvas id="cv"></canvas>
<div id="timer">0.00<small>秒</small></div>
<div id="remain"></div>
<div id="call"></div>

<div class="screen on" id="title">
  <div>
    <div class="logo"><span>俺の</span>トイレット<br>ペーパー！</div>
    <p class="catch">1ロールを最速で使い切れ！</p>
  </div>
  <div>
    <p class="tap">TAP TO START</p>
    <p class="best" id="tBest"></p>
    <p class="help">下にスワイプ（PCはホイール）で紙を引く<br>速すぎると…ビリッ！とちぎれるので注意</p>
  </div>
</div>

<div class="screen" id="result"><div class="card" id="card">
  <p class="done" id="rDone">使い切った！</p>
  <p class="rtime" id="rTime">0.00<small>秒</small></p>
  <p id="rNew"></p>
  <p class="rank" id="rRank"></p>
  <p class="rsub" id="rSub"></p>
  <button class="btn b1" id="bRetry">もう一回</button>
  <button class="btn b2" id="bShare">𝕏 でシェア</button>
  <button class="btn b3" id="bTitle">タイトルへ</button>
</div></div>

<script>
(() => {
'use strict';

/* ===== 設定 ===== */
const SHARE_URL = '';          // 公開URLが決まったらここに入れる
const TOTAL = 16000;           // 1ロールの長さ（画面上の引っ張り量）
const METERS = 30;             // 表示上の長さ（m）
const TEAR = 3600;             // この速さを超えるとちぎれる
const STUN = 0.7;              // ちぎれた時に止まる秒数
const GOLD_RATE = 0.2;         // 金色が出る確率（5回に1回）
const RANKS = [                // [秒未満, 称号, ひとこと]
  [6.5, '紙の神', '人間の手とは思えない速さ'],
  [8, 'トイレの覇者', 'ペーパーがひれ伏すレベル'],
  [10, 'カラカラ職人', 'リズムが完璧'],
  [13, '紙さばき上手', 'あと少しで職人の域'],
  [18, 'ふつうの人', '日常ではこれで十分'],
  [Infinity, 'のんびり屋', 'トイレは落ち着く場所です']
];

/* ===== ユーティリティ ===== */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const store = {
  get(k, d) { try { const v = localStorage.getItem('karakara_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('karakara_' + k, JSON.stringify(v)); } catch (e) {} }
};
const fmt = t => t.toFixed(2);
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

/* ===== 音 ===== */
let actx = null, rollGain = null;
function au() {
  if (actx) return actx;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    // カラカラ音（ずっと鳴らして音量だけ変える）
    const len = actx.sampleRate * 2, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (0.6 + 0.4 * Math.sin(i / 90));
    const s = actx.createBufferSource(); s.buffer = b; s.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 0.8;
    rollGain = actx.createGain(); rollGain.gain.value = 0;
    s.connect(f); f.connect(rollGain); rollGain.connect(actx.destination); s.start();
  } catch (e) {}
  return actx;
}
function tone(f, dur, type = 'sine', vol = 0.12, slide = 1, delay = 0) {
  const a = au(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f * slide, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur);
}
function rip() {
  const a = au(); if (!a) return;
  const len = a.sampleRate * 0.25, b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2) * (Math.random() < 0.3 ? 1 : 0.3);
  const s = a.createBufferSource(); s.buffer = b;
  const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1500;
  const g = a.createGain(); g.gain.value = 0.5;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}

/* ===== 状態 ===== */
let phase = 'title';           // title / ready / play / done
let gold = false;
let pos = 0, vel = 0, hang = 70, stun = 0, tears = 0, over = 0;
let tStart = 0, tNow = 0, spin = 0;
let falling = [], sparks = [], shake = 0;
let best = store.get('best', 0);
let rounds = store.get('rounds', 0);

function rollR() {             // 残りの量から半径を出す（面積に比例）
  const f = clamp(1 - pos / TOTAL, 0, 1), R0 = 92, RC = 24;
  return Math.sqrt(RC * RC + f * (R0 * R0 - RC * RC));
}

/* ===== 画面の流れ ===== */
function showBest() { $('#tBest').textContent = best ? `自己ベスト ${fmt(best)} 秒` : ''; }
showBest();

function startRound() {
  au();
  // 5回に1回くらい金色（最初の4回で一度も出なければ5回目は確定）
  rounds++; store.set('rounds', rounds);
  const sinceGold = store.get('sinceGold', 0);
  gold = Math.random() < GOLD_RATE || sinceGold >= 4;
  store.set('sinceGold', gold ? 0 : sinceGold + 1);
  pos = 0; vel = 0; hang = 70; stun = 0; tears = 0; falling = []; sparks = []; spin = 0;
  $('#title').classList.remove('on'); $('#result').classList.remove('on');
  $('#timer').style.display = 'block'; $('#remain').style.display = 'block';
  setTimer(0);
  phase = 'ready';
  let t = 0;
  if (gold) { call('✨金のトイレットペーパー✨', 'gold'); tone(1318, 0.15, 'triangle', 0.1); tone(1760, 0.3, 'triangle', 0.1, 1, 0.12); burstSparks(60); t = 1300; }
  setTimeout(() => { call('よ〜い'); tone(660, 0.18, 'square', 0.08); }, t);
  // 「スタート」はタイミングを少しランダムにしてフライングを防ぐ
  setTimeout(() => {
    call('スタート！'); tone(1320, 0.4, 'square', 0.1);
    phase = 'play'; tStart = performance.now();
    setTimeout(() => { if ($('#call').textContent === 'スタート！') $('#call').style.display = 'none'; }, 600);
  }, t + rnd(1100, 1700));
}
function call(text, cls = '') {
  const c = $('#call'); c.textContent = text; c.className = cls; c.style.display = 'block';
  void c.offsetWidth; c.classList.add('pop');
}
function setTimer(t) { $('#timer').innerHTML = `${fmt(t)}<small>秒</small>`; }

function finish() {
  phase = 'done';
  const t = (performance.now() - tStart) / 1000; tNow = t;
  setTimer(t);
  if (rollGain) rollGain.gain.value = 0;
  const isNew = !best || t < best;
  if (isNew) { best = t; store.set('best', best); }
  const rk = RANKS.find(r => t < r[0]);
  tone(784, 0.15, 'triangle', 0.1); tone(988, 0.15, 'triangle', 0.1, 1, 0.13); tone(1318, 0.4, 'triangle', 0.1, 1, 0.26);
  burstSparks(gold ? 90 : 40);
  setTimeout(() => {
    $('#rDone').textContent = gold ? '✨ 金のロールを使い切った！' : '使い切った！';
    $('#rTime').innerHTML = `${fmt(t)}<small>秒</small>`;
    $('#rNew').innerHTML = isNew ? '<span class="new">NEW RECORD!</span>' : '';
    $('#rRank').textContent = `【${rk[1]}】`;
    $('#rSub').innerHTML = `${rk[2]}<br>ビリッ ${tears}回 ／ 自己ベスト ${fmt(best)}秒`;
    $('#card').className = 'card' + (gold ? ' goldc' : '');
    $('#result').classList.add('on');
    $('#timer').style.display = 'none'; $('#remain').style.display = 'none';
    lastShare = { t, rk: rk[1] };
  }, 900);
}
let lastShare = null;
function share() {
  if (!lastShare) return;
  const text = `トイレットペーパー1ロールを ${fmt(lastShare.t)}秒 で使い切った！【${lastShare.rk}】${gold ? '✨金のロール✨' : ''}\n#俺のトイレットペーパー #ブラウザゲーム`;
  const url = 'https://x.com/intent/tweet?text=' + encodeURIComponent(text) + (SHARE_URL ? '&url=' + encodeURIComponent(SHARE_URL) : '');
  window.open(url, '_blank');
}
function toTitle() { phase = 'title'; $('#result').classList.remove('on'); $('#title').classList.add('on'); pos = 0; vel = 0; hang = 70; gold = false; showBest(); }

$('#title').addEventListener('click', startRound);
$('#bRetry').addEventListener('click', startRound);
$('#bShare').addEventListener('click', share);
$('#bTitle').addEventListener('click', toTitle);

/* ===== 入力（下スワイプ／ホイール） ===== */
let drag = null;
const cv = $('#cv'), ctx = cv.getContext('2d');
cv.addEventListener('pointerdown', e => { drag = { id: e.pointerId, y: e.clientY, t: performance.now() }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const now = performance.now(), dy = (e.clientY - drag.y) / SC, dt = Math.max(12, now - drag.t) / 1000;
  drag.y = e.clientY; drag.t = now;
  if (phase !== 'play' || stun > 0 || dy <= 0) return;
  pull(dy, dy / dt);
});
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, e => { if (drag && e.pointerId === drag.id) drag = null; }));
window.addEventListener('wheel', e => {
  e.preventDefault();
  if (phase !== 'play' || stun > 0 || e.deltaY <= 0) return;
  const d = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
  vel = Math.max(vel, 0) + d * 3.2;
}, { passive: false });

function pull(dy, speed) {
  pos += dy; hang += dy;
  // 指の速さに合わせて回転（なめらかに）
  vel = vel * 0.7 + Math.min(speed, TEAR * 1.6) * 0.3;
}

/* ===== 更新 ===== */
function update(dt) {
  if (phase === 'play') {
    tNow = (performance.now() - tStart) / 1000; setTimer(tNow);
    if (stun > 0) { stun -= dt; vel = 0; }
    else {
      const dragging = drag !== null;
      if (!dragging || vel > 0) {
        // 手を離しても惰性で回る（残りが少ないほど軽く回る）
        if (!dragging) { const d = vel * dt; pos += d; hang += d; }
        const f = 1 - pos / TOTAL;
        vel *= Math.exp(-(dragging ? 0 : 1.6 + 2.2 * f) * dt);
      }
      if (dragging && drag && performance.now() - drag.t > 60) vel *= Math.exp(-12 * dt);   // 指を止めたら止まる
      // 一瞬速すぎただけではちぎれない（赤ゾーンに0.15秒いたらビリッ）
      if (vel > TEAR) { over += dt; if (over > 0.15) tear(); } else over = Math.max(0, over - dt * 2);
    }
    if (pos >= TOTAL) { pos = TOTAL; finish(); }
    const left = Math.max(0, METERS * (1 - pos / TOTAL));
    $('#remain').textContent = `のこり ${left.toFixed(1)} m${tears ? `　ビリッ×${tears}` : ''}`;
  } else if (phase !== 'done') { vel *= Math.exp(-3 * dt); }
  if (phase === 'done') { vel *= Math.exp(-2 * dt); spin += vel * dt / 24; }
  spin += Math.max(0, vel) * dt / rollR();
  if (rollGain && actx) rollGain.gain.setTargetAtTime(phase === 'play' ? clamp(vel / TEAR, 0, 1) * 0.35 : 0, actx.currentTime, 0.03);
  for (const p of falling) { p.vy += 1400 * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.x += p.vx * dt; }
  falling = falling.filter(p => p.y < 900);
  for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 300 * dt; }
  sparks = sparks.filter(s => s.t < s.life);
  if (gold && Math.random() < 0.25) sparks.push({ x: rnd(80, 320), y: rnd(120, 640), vx: 0, vy: -20, t: 0, life: rnd(0.4, 0.9), s: rnd(1.5, 3.5), star: true });
  shake = Math.max(0, shake - dt);
}
function tear() {
  tears++; stun = STUN; shake = 0.35; vibrate([40, 30, 60]); rip();
  const top = AX_Y + rollR();
  falling.push({ x: 200, y: top + 8, len: Math.min(hang, FLOOR - top), vy: 0, vx: rnd(-40, 40), rot: 0, vr: rnd(-1.5, 1.5), off: pos });
  hang = 8; vel = 0; over = 0;
  call('ビリッ！'); setTimeout(() => { if ($('#call').textContent === 'ビリッ！') $('#call').style.display = 'none'; }, 500);
}
function burstSparks(n) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(80, 380); sparks.push({ x: 200, y: 300, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, t: 0, life: rnd(0.6, 1.3), s: rnd(2, 5), star: gold, c: gold ? '#ffd43b' : ['#5b86c8', '#c0563c', '#ffd43b', '#69db7c'][i % 4] }); } }

/* ===== 描画 ===== */
const W = 400, H = 760, AX_X = 200, AX_Y = 210, FLOOR = 700, RW = 230;
let SC = 1, OX = 0, OY = 0, DPR = 1, camY = 170;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  SC = Math.min(innerWidth / W, innerHeight / H); OX = (innerWidth - W * SC) / 2; OY = (innerHeight - H * SC) / 2;
}
addEventListener('resize', resize); resize();

function metal(x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  if (gold) { g.addColorStop(0, '#fff3bf'); g.addColorStop(0.35, '#f5c518'); g.addColorStop(0.55, '#fff0a0'); g.addColorStop(1, '#a87400'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#c4cad1'); g.addColorStop(0.55, '#f1f3f5'); g.addColorStop(1, '#7d858e'); }
  return g;
}
const PAPER = () => gold ? ['#fff6cf', '#f3d36b', '#e8bb2e'] : ['#ffffff', '#e6e6e6', '#cfcfcf'];
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function drawWall() {
  // タイル壁
  ctx.fillStyle = '#f4efe6'; ctx.fillRect(-200, -400, W + 400, FLOOR + 400);
  ctx.strokeStyle = 'rgba(160,140,115,.25)'; ctx.lineWidth = 2;
  for (let y = -400; y < FLOOR; y += 50) { ctx.beginPath(); ctx.moveTo(-200, y); ctx.lineTo(W + 200, y); ctx.stroke(); }
  for (let y = -400, r = 0; y < FLOOR; y += 50, r++) for (let x = -200 + (r % 2) * 25; x < W + 200; x += 50) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 50); ctx.stroke(); }
  // 床
  const g = ctx.createLinearGradient(0, FLOOR, 0, H + 200); g.addColorStop(0, '#b9a58a'); g.addColorStop(1, '#8d7a62');
  ctx.fillStyle = g; ctx.fillRect(-200, FLOOR, W + 400, H + 400);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(-200, FLOOR, W + 400, 6);
}
// 紙の表面（エンボス柄とミシン目）
function paperSheet(x, y, w, h, off) {
  const [c0, c1, c2] = PAPER();
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, c2); g.addColorStop(0.1, c0); g.addColorStop(0.85, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = gold ? 'rgba(200,150,0,.18)' : 'rgba(0,0,0,.06)';
  const step = 16, o = ((off % step) + step) % step;
  for (let yy = y - step + o; yy < y + h; yy += step) for (let xx = x + 8 + ((Math.round((yy - o) / step)) % 2) * 8; xx < x + w; xx += 16) { ctx.beginPath(); ctx.arc(xx, yy, 2.2, 0, 6.3); ctx.fill(); }
  // ミシン目（12cmごと）
  const per = 130, po = ((off % per) + per) % per;
  ctx.strokeStyle = gold ? 'rgba(170,120,0,.4)' : 'rgba(0,0,0,.18)'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.2;
  for (let yy = y - per + po; yy < y + h; yy += per) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke(); }
  ctx.setLineDash([]); ctx.restore();
}
function drawPile() {
  const amt = clamp(pos / TOTAL, 0, 1);
  if (amt <= 0.002) return;
  const [c0, c1, c2] = PAPER(), h = 8 + amt * 110, w = 210 + amt * 110;
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(AX_X, FLOOR + 6, w * 0.55, 10, 0, 0, 6.3); ctx.fill();
  // ふんわり積もった紙の山（上辺をゆるく波打たせる）
  const top = t => FLOOR + 4 - h * Math.pow(Math.sin(t * Math.PI), 0.8) - Math.sin(t * 19) * 3 * amt;
  ctx.beginPath(); ctx.moveTo(AX_X - w / 2, FLOOR + 6);
  for (let i = 0; i <= 40; i++) { const t = i / 40; ctx.lineTo(AX_X - w / 2 + w * t, top(t)); }
  ctx.lineTo(AX_X + w / 2, FLOOR + 6); ctx.closePath();
  const g = ctx.createLinearGradient(0, FLOOR - h, 0, FLOOR + 6); g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = c2; ctx.lineWidth = 1.5; ctx.stroke();
  // 折り重なったシワ
  ctx.strokeStyle = gold ? 'rgba(170,120,0,.35)' : 'rgba(0,0,0,.09)'; ctx.lineWidth = 1.5;
  for (let k = 1; k <= 4; k++) {
    const yy = k / 5;
    ctx.beginPath();
    for (let i = 4; i <= 36; i++) { const t = i / 40, y0 = top(t), y = y0 + (FLOOR + 4 - y0) * yy + Math.sin(t * 13 + k * 2) * 3; i === 4 ? ctx.moveTo(AX_X - w / 2 + w * t, y) : ctx.lineTo(AX_X - w / 2 + w * t, y); }
    ctx.stroke();
  }
}
function drawRoll() {
  const r = rollR(), x0 = AX_X - RW / 2, x1 = AX_X + RW / 2, [c0, c1, c2] = PAPER();
  // 垂れ下がる紙（床の山まで）
  const top = AX_Y + r - 2, pileTop = FLOOR - 10 - clamp(pos / TOTAL, 0, 1) * 100;
  const len = Math.min(hang, pileTop - top);
  if (len > 0) {
    paperSheet(x0 + 6, top, RW - 12, len, pos);
    if (hang < pileTop - top) {   // 紙の先端（ギザギザ）
      ctx.fillStyle = c0; ctx.beginPath(); ctx.moveTo(x0 + 6, top + len);
      for (let i = 0; i <= 18; i++) ctx.lineTo(x0 + 6 + (RW - 12) * i / 18, top + len + (i % 2 ? 3 : 0));
      ctx.lineTo(x1 - 6, top + len - 2); ctx.closePath(); ctx.fill();
    }
  }
  // ロール本体（円柱を正面から）
  const g = ctx.createLinearGradient(0, AX_Y - r, 0, AX_Y + r);
  g.addColorStop(0, c2); g.addColorStop(0.35, c0); g.addColorStop(0.55, c0); g.addColorStop(0.85, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; rr(x0, AX_Y - r, RW, r * 2, Math.min(10, r)); ctx.fill();
  // 回転して見えるスジ
  ctx.save(); ctx.beginPath(); ctx.rect(x0, AX_Y - r, RW, r * 2); ctx.clip();
  for (let i = 0; i < 10; i++) {
    const a = spin + i * Math.PI * 2 / 10, c = Math.cos(a);
    if (c <= 0) continue;
    ctx.strokeStyle = gold ? `rgba(190,140,0,${0.22 * c})` : `rgba(0,0,0,${0.07 * c})`; ctx.lineWidth = 1.5;
    const y = AX_Y + Math.sin(a) * r; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  }
  ctx.restore();
  // 右の断面（巻きの層と芯）
  const ex = x1 - 2, ew = 9;
  ctx.fillStyle = c1; ctx.beginPath(); ctx.ellipse(ex, AX_Y, ew, r, 0, 0, 6.3); ctx.fill();
  ctx.strokeStyle = gold ? 'rgba(170,120,0,.35)' : 'rgba(0,0,0,.1)'; ctx.lineWidth = 1;
  for (let rr2 = 28; rr2 < r; rr2 += 6) { ctx.beginPath(); ctx.ellipse(ex, AX_Y, ew * rr2 / r, rr2, 0, 0, 6.3); ctx.stroke(); }
  ctx.fillStyle = gold ? '#c8962a' : '#b98a5a'; ctx.beginPath(); ctx.ellipse(ex, AX_Y, ew * 24 / Math.max(r, 24), 24, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#5a4632'; ctx.beginPath(); ctx.ellipse(ex, AX_Y, ew * 19 / Math.max(r, 24), 19, 0, 0, 6.3); ctx.fill();
}
function drawHolder() {
  // 左右の支え
  for (const sx of [AX_X - RW / 2 - 24, AX_X + RW / 2 + 4]) {
    ctx.fillStyle = 'rgba(0,0,0,.12)'; rr(sx + 3, AX_Y - 52, 20, 104, 9); ctx.fill();
    ctx.fillStyle = metal(sx, 0, sx + 20, 0); rr(sx, AX_Y - 55, 20, 104, 9); ctx.fill();
    ctx.strokeStyle = gold ? '#8a6000' : '#6c737a'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = metal(sx, AX_Y - 8, sx + 20, AX_Y + 8); ctx.beginPath(); ctx.arc(sx + 10, AX_Y, 7, 0, 6.3); ctx.fill(); ctx.stroke();
  }
  // 上のカバー（紙切り）
  const cx0 = AX_X - RW / 2 - 30, cw = RW + 60, cy = AX_Y - 104, ch = 70;
  ctx.fillStyle = 'rgba(0,0,0,.15)'; rr(cx0 + 3, cy + 6, cw, ch, 16); ctx.fill();
  ctx.fillStyle = metal(0, cy, 0, cy + ch); rr(cx0, cy, cw, ch, 16); ctx.fill();
  ctx.strokeStyle = gold ? '#8a6000' : '#6c737a'; ctx.lineWidth = 2; ctx.stroke();
  // ギザギザの刃
  ctx.fillStyle = gold ? '#a87400' : '#868e96';
  ctx.beginPath(); ctx.moveTo(cx0 + 14, cy + ch - 1);
  for (let i = 0; i <= 40; i++) ctx.lineTo(cx0 + 14 + (cw - 28) * i / 40, cy + ch + (i % 2 ? 4 : -1));
  ctx.lineTo(cx0 + cw - 14, cy + ch - 1); ctx.closePath(); ctx.fill();
  // ツヤ
  ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(cx0 + 18, cy + 9, cw - 36, 8, 4); ctx.fill();
  if (gold) { ctx.fillStyle = '#7a5200'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GOLD', AX_X, cy + 44); }
}
function drawGauge() {
  if (phase !== 'play') return;
  const x = 372, y = 260, h = 300, k = clamp(vel / TEAR, 0, 1.05);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; rr(x - 2, y - 2, 18, h + 4, 9); ctx.fill();
  ctx.fillStyle = '#fff'; rr(x, y, 14, h, 7); ctx.fill();
  ctx.fillStyle = 'rgba(224,49,49,.25)'; rr(x, y, 14, h * 0.15, 7); ctx.fill();
  ctx.fillStyle = k > 0.85 ? '#e03131' : k > 0.6 ? '#fcc419' : '#51cf66';
  const fh = h * Math.min(1, k); rr(x, y + h - fh, 14, Math.max(4, fh), 7); ctx.fill();
  ctx.fillStyle = '#8a837e'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('勢い', x + 7, y + h + 18);
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#efe7da'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  const sx = shake > 0 ? rnd(-6, 6) * shake / 0.35 : 0, sy = shake > 0 ? rnd(-4, 4) * shake / 0.35 : 0;
  camY += ((phase === 'title' ? 170 : 0) - camY) * 0.12;   // タイトルではホルダーを少し下に
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * (OX + sx), DPR * (OY + sy + camY * SC));
  drawWall();
  drawPile();
  drawRoll();
  drawHolder();
  for (const p of falling) { ctx.save(); ctx.translate(p.x, p.y + p.len / 2); ctx.rotate(p.rot * 0.3); paperSheet(-(RW - 12) / 2, -p.len / 2, RW - 12, p.len, p.off); ctx.restore(); }
  for (const s of sparks) {
    ctx.globalAlpha = 1 - s.t / s.life; ctx.fillStyle = s.c || '#fff3a0';
    if (s.star) { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.t * 4); ctx.beginPath(); for (let i = 0; i < 8; i++) { const rr3 = i % 2 ? s.s * 0.4 : s.s * 1.6, a = i * Math.PI / 4; ctx.lineTo(Math.cos(a) * rr3, Math.sin(a) * rr3); } ctx.closePath(); ctx.fill(); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.3); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  drawGauge();
}

/* ===== ループ ===== */
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

window.karakaraDebug = { get phase() { return phase; }, get pos() { return pos; }, get vel() { return vel; }, get tears() { return tears; }, get gold() { return gold; }, pull: (dy, sp) => pull(dy, sp) };
})();
</script>
